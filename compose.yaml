name: smerp-test
services:
  app:
    image: smerp-test:local
    build: .
    restart: always
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    pids_limit: 100
    volumes:
      - data:/data
    networks: [workshop]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const { origin, port } = require('/app/config.json');
          require('node:http').get({
            hostname: '127.0.0.1',
            port,
            path: '/health',
            headers: { Host: new URL(origin).host },
          }, response => process.exit(response.statusCode === 200 ? 0 : 1))
            .on('error', () => process.exit(1));
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
  tunnel:
    image: cloudflare/cloudflared@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/tunnel-token]
    user: "1000:1000"
    restart: always
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    volumes:
      - ./.cloudflared-token:/run/secrets/tunnel-token:ro,Z
    networks: [workshop, egress]
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: local
volumes:
  data:
networks:
  workshop:
    internal: true
  egress:
